<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fern Hollow — Playtest</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18392e;color:#f8efd1;font-family:system-ui,sans-serif}
#unity-canvas{position:absolute;left:env(safe-area-inset-left,0px);top:env(safe-area-inset-top,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:block;touch-action:none;outline:none}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#18392e;padding:30px;gap:14px}
h1{margin:0;font-size:34px}p{margin:0;line-height:1.5;max-width:480px}progress{width:100%;height:12px;accent-color:#b5ce7a}
#rotate{display:none;position:absolute;inset:0;background:#18392e;place-content:center;text-align:center;padding:30px;z-index:5}

</style>
</head>
<body>
<canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Fern Hollow survival playtest"></canvas>
<div id="loading"><h1>Fern Hollow</h1><p>Loading the clearing…</p><progress id="progress" max="1" value="0"></progress><p id="status">Phone: turn sideways. Touch anywhere to move.<br>PC: WASD, Shift sprint, hold Space to bite.</p></div>
<div id="rotate"><h1>Turn your phone sideways</h1><p>Exploring works best in landscape. You can customize looks upright.</p></div>
<script src="Build/BrowserBuild.loader.js"></script>
<script>
const canvas=document.getElementById('unity-canvas');
function updateRotation(){const portrait=window.matchMedia('(orientation:portrait) and (pointer:coarse)').matches;const family=window.fernFamily;const browse=window.fernState?.menu||family?.studio||family?.panel||family?.stats||family?.eggs||window.fernUI?.hatch;const blocked=portrait&&!browse;window.fernOrientationPaused=blocked;document.getElementById('rotate').style.display=blocked?'grid':'none';}
window.addEventListener('resize',updateRotation);setInterval(updateRotation,100);updateRotation();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
createUnityInstance(canvas,{
  arguments:[],
  dataUrl:'Build/BrowserBuild.data.unityweb',
  frameworkUrl:'Build/BrowserBuild.framework.js.unityweb',
  codeUrl:'Build/BrowserBuild.wasm.unityweb',
  streamingAssetsUrl:'StreamingAssets',
  companyName:"Fern Hollow",
  productName:"Fern Hollow - Dinosaur Playground",
  productVersion:"1.0",
  devicePixelRatio:Math.min(window.devicePixelRatio||1,1.25),
  showBanner:(message,type)=>{if(type==='error')document.getElementById('status').textContent=message;}
},p=>document.getElementById('progress').value=p).then(instance=>{
  window.fernGame=instance;
  document.getElementById('loading').style.display='none';canvas.focus();
}).catch(error=>document.getElementById('status').textContent='Could not load the clearing. Please reload. '+error);
</script>
</body>
</html>
